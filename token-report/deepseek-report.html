<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek Usage Report — 5-15 Sep 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#c9d1d9; --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85149; --yellow:#d29922; --purple:#bc8cff; --orange:#f0883e; --cyan:#39d353; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'SF Mono','Fira Code',monospace; padding:24px; max-width:1400px; margin:0 auto; }
  h1 { color:var(--accent); font-size:1.5em; }
  h2 { color:var(--text); font-size:1.1em; margin:28px 0 12px; border-bottom:1px solid var(--border); padding-bottom:6px; }
  h3 { color:var(--dim); font-size:0.9em; margin:14px 0 8px; }
  .sub { color:var(--dim); font-size:0.8em; margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin-bottom:20px; }
  .m { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:14px; text-align:center; }
  .m .v { font-size:1.7em; font-weight:bold; }
  .m .l { color:var(--dim); font-size:0.75em; margin-top:3px; }
  .m.bl .v{color:var(--accent)} .m.gn .v{color:var(--green)} .m.yl .v{color:var(--yellow)}
  .m.pu .v{color:var(--purple)} .m.or .v{color:var(--orange)} .m.cy .v{color:var(--cyan)}
  .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px; }
  .box { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:14px; }
  .box h3 { margin-top:0; color:var(--text); }
  table { width:100%; border-collapse:collapse; font-size:0.78em; }
  th { background:var(--card); color:var(--dim); text-align:left; padding:7px 8px; border-bottom:2px solid var(--border); }
  td { padding:5px 8px; border-bottom:1px solid var(--border); }
  tr:hover td { background:rgba(88,166,255,0.04); }
  .n { text-align:right; font-variant-numeric:tabular-nums; }
  .pct { color:var(--cyan); } .cost { color:var(--yellow); } .na { color:var(--dim); }
  .tag { display:inline-block; padding:1px 5px; border-radius:3px; font-size:0.72em; margin-left:3px; }
  .t-free { background:rgba(63,185,80,0.15); color:var(--green); }
  .t-paid { background:rgba(248,81,73,0.15); color:var(--red); }
  .t-empty { background:rgba(139,148,158,0.15); color:var(--dim); }
  .section { margin-bottom:28px; }
  .metric-big { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:32px; text-align:center; margin-bottom:20px; }
  .metric-big .big-value { font-size:3em; font-weight:bold; color:var(--accent); }
  .metric-big .big-label { color:var(--dim); font-size:1em; margin-top:6px; }
  @media(max-width:800px){.row{grid-template-columns:1fr;}}
</style>
</head>

function fmt(n){return n.toLocaleString('en-US')}
function pct(a,b){return b>0?(a/b*100).toFixed(1):'0.0'}
function ch(s){const t=s.ti+s.tcr;return t>0?(s.tcr/t*100).toFixed(1):'N/A'}
function or_(s){const t=s.ti+s.tcr;return t>0?((s.to)/t*100).toFixed(1):'N/A'}
function na(v){return v===0||v==='N/A'?'<span class="na">N/A</span>':v}

const app=document.getElementById('app');
const g=D.grand;
const gTi=g.ti+g.tcr;

app.innerHTML=`<h2>5-15 Sep Total</h2>
<div class="metric-big">
  <div class="big-value">${fmt(g.ti+g.to+g.tcr)}</div>
  <div class="big-label">Total Tokens</div>
</div>
<div class="grid">
  <div class="m bl"><div class="v">${fmt(g.requests)}</div><div class="l">API Requests</div></div>
  <div class="m yl"><div class="v">$${g.cost.toFixed(2)}</div><div class="l">Total Cost</div></div>
  <div class="m pu"><div class="v">${fmt(g.ti)}</div><div class="l">Input Tokens</div></div>
  <div class="m or"><div class="v">${fmt(g.to)}</div><div class="l">Output Tokens</div></div>

  <div class="m gn"><div class="v">${gTi>0?(g.tcr/gTi*100).toFixed(1):'N/A'}%</div><div class="l">Cache Hit Rate</div></div>
</div>`;

const daySec=document.createElement('div');daySec.className='section';
daySec.innerHTML=`<h2>Daily Requests</h2>
<div class="row">
  <div class="box"><h3>Requests per Day</h3><canvas id="dayReq"></canvas></div>
  <div class="box"><h3>Cost per Day</h3><canvas id="dayCost"></canvas></div>
</div>`;

const mSec=document.createElement('div');mSec.className='section';

<div class="row">
  <div class="box"><h3>Requests by Model</h3><canvas id="modelReq"></canvas></div>
  <div class="box"><h3>Cost by Model</h3><canvas id="modelCost"></canvas></div>
</div>`;

const mtSec=document.createElement('div');mtSec.className='section';
let mtH=`<h3>Model Summary</h3><table><thead><tr>
<th>Model</th><th class="n">Requests</th><th class="n">Input</th><th class="n">Output</th>
<th class="n">CacheRead</th><th class="n">CacheHit</th><th class="n">OutRatio</th><th class="n">Cost</th>
</tr></thead><tbody>`;
for(const m of D.by_model){
  const free=m.cost===0;const empty=m.ti===0&&m.to===0;
  const tag=empty?'<span class="tag t-empty">empty</span>':free?'<span class="tag t-free">free</span>':'<span class="tag t-paid">paid</span>';
  mtH+=`<tr><td>${m.model} ${tag}</td>
  <td class="n">${fmt(m.requests)}</td><td class="n">${fmt(m.ti)}</td><td class="n">${fmt(m.to)}</td>
  <td class="n">${fmt(m.tcr)}</td><td class="n pct">${ch(m)}</td><td class="n pct">${or_(m)}</td>

const dSec=document.createElement('div');dSec.className='section';

  <td class="n">${fmt(t.to)}</td><td class="n">${fmt(t.tcr)}</td><td class="n pct">${ch(t)}</td>

}
dH+=`</tbody></table>`;

requestAnimationFrame(()=>{
  const colors=['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff','#f0883e','#39d353','#a371f7','#79c0ff'];
  const dayLabels=D.days.map(d=>d.date);
  const dayReqs=D.days.map(d=>d.total.requests);
  const dayCosts=D.days.map(d=>d.total.cost);

  new Chart(document.getElementById('dayReq'),{type:'bar',data:{labels:dayLabels,datasets:[{label:'Requests',data:dayReqs,backgroundColor:'rgba(88,166,255,0.7)'}]},options:{responsive:true,scales:{x:{ticks:{color:'#8b949e'},grid:{color:'#30363d'}},y:{ticks:{color:'#8b949e'},grid:{color:'#30363d'}}},plugins:{legend:{labels:{color:'#c9d1d9'}}}}});
  new Chart(document.getElementById('dayCost'),{type:'bar',data:{labels:dayLabels,datasets:[{label:'Cost $',data:dayCosts,backgroundColor:'rgba(210,153,34,0.7)'}]},options:{responsive:true,scales:{x:{ticks:{color:'#8b949e'},grid:{color:'#30363d'}},y:{ticks:{color:'#8b949e'},grid:{color:'#30363d'}}},plugins:{legend:{labels:{color:'#c9d1d9'}}}}});

  const mLabels=D.by_model.map(m=>m.model);
  const mReqs=D.by_model.map(m=>m.requests);
  const mCosts=D.by_model.map(m=>m.cost);
  new Chart(document.getElementById('modelReq'),{type:'doughnut',data:{labels:mLabels,datasets:[{data:mReqs,backgroundColor:colors.slice(0,mLabels.length),borderWidth:0}]},options:{responsive:true,plugins:{legend:{position:'right',labels:{color:'#c9d1d9',font:{size:10}}}}}});
  new Chart(document.getElementById('modelCost'),{type:'doughnut',data:{labels:mLabels,datasets:[{data:mCosts,backgroundColor:colors.slice(0,mLabels.length),borderWidth:0}]},options:{responsive:true,plugins:{legend:{position:'right',labels:{color:'#c9d1d9',font:{size:10}}}}}});

  new Chart(document.getElementById('trend'),{type:'line',data:{labels:dayLabels,datasets:[
    {label:'Requests',data:dayReqs,borderColor:'#58a6ff',backgroundColor:'rgba(88,166,255,0.1)',fill:true,tension:0.3,yAxisID:'y'},
    {label:'Cost $',data:dayCosts,borderColor:'#d29922',backgroundColor:'rgba(210,153,34,0.1)',fill:true,tension:0.3,yAxisID:'y1'}
  ]},options:{responsive:true,scales:{x:{ticks:{color:'#8b949e'},grid:{color:'#30363d'}},y:{position:'left',ticks:{color:'#58a6ff'},grid:{color:'#30363d'}},y1:{position:'right',ticks:{color:'#d29922'},grid:{drawOnChartArea:false}}},plugins:{legend:{labels:{color:'#c9d1d9'}}}}});

  // Cache hit & output ratio per day with amounts
  const ratioLabels=D.days.map(d=>d.date);
  const ratioData=D.days.map(d=>{
    const t=d.total;const ti=t.ti+t.tcr;
    return {
      ch: ti>0?(t.tcr/ti*100):0,
      or: ti>0?((t.to)/ti*100):0,
      chAmt: t.tcr,
      orAmt: t.to,
      totalIn: ti
    };
  });
  new Chart(document.getElementById('ratio'),{type:'bar',data:{labels:ratioLabels,datasets:[
    {label:'Cache Hit %',data:ratioData.map(d=>d.ch),backgroundColor:'rgba(63,185,80,0.7)',
     amountData:ratioData.map(d=>d.chAmt)},
    {label:'Output Ratio %',data:ratioData.map(d=>d.or),backgroundColor:'rgba(188,140,255,0.7)',
     amountData:ratioData.map(d=>d.orAmt)}
  ]},options:{responsive:true,
    plugins:{legend:{labels:{color:'#c9d1d9'}},
      tooltip:{callbacks:{
        label:function(ctx){
          const amt=ctx.dataset.amountData[ctx.dataIndex];
          return ctx.dataset.label+': '+ctx.parsed.y.toFixed(1)+'% ('+fmt(amt)+' tokens)';
        }
      }}
    },
    scales:{x:{ticks:{color:'#8b949e'},grid:{color:'#30363d'}},y:{ticks:{color:'#8b949e'},grid:{color:'#30363d'}}}}});
});
</script>
