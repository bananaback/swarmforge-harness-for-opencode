<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek Usage Report — 5-16 Sep 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#c9d1d9; --dim:#8b949e;
          --accent:#58a6ff; --green:#3fb950; --yellow:#d29922; --purple:#bc8cff; --orange:#f0883e; --red:#f85149; --cyan:#39d353; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'SF Mono','Fira Code',monospace;
         padding:24px; max-width:1180px; margin:0 auto; }
  h1 { color:var(--accent); font-size:1.35em; }
  .sub { color:var(--dim); font-size:0.78em; margin:6px 0 20px; }
  .kpi-h { color:var(--dim); font-size:0.72em; font-weight:normal; margin:0 0 8px; text-transform:uppercase; letter-spacing:0.08em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:10px; margin-bottom:16px; }
  .m { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:13px; text-align:center; }
  .m .v { font-size:1.3em; font-weight:bold; }
  .m .l { color:var(--dim); font-size:0.7em; margin-top:3px; }
  .m.bl .v{color:var(--accent)} .m.gn .v{color:var(--green)} .m.yl .v{color:var(--yellow)}
  .m.pu .v{color:var(--purple)} .m.or .v{color:var(--orange)} .m.cy .v{color:var(--cyan)} .m.rd .v{color:var(--red)}
  .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px; align-items:start; }
  .row.one { grid-template-columns:1fr; }
  .box { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:14px; }
  .box h3 { color:var(--dim); font-size:0.76em; font-weight:normal; margin-bottom:10px; }
  /* Chart.js needs a dedicated, relatively-positioned container with a definite
     height; without it a responsive canvas feeds its own growth back into the
     page and stretches on every resize. */
  .chart { position:relative; height:250px; }
  .note { color:var(--dim); font-size:0.72em; margin-top:16px; line-height:1.8; }
  @media(max-width:820px){ .row{grid-template-columns:1fr} }
</style>
</head>
<body>
<h1>DeepSeek Usage Report</h1>
<div class="sub" id="sub"></div>
<h3 class="kpi-h">Economics</h3>
<div class="grid" id="kpis"></div>
<h3 class="kpi-h">Tokens</h3>
<div class="grid" id="tokenKpis"></div>
<h3 class="kpi-h">Go cycle</h3>
<div class="grid" id="cycleKpis"></div>
<div class="row">
  <div class="box"><h3>Daily cost &mdash; peak-aware (off-peak + peak)</h3><div class="chart"><canvas id="dailyAware"></canvas></div></div>
  <div class="box"><h3>Daily cost &mdash; reported by OpenCode Go</h3><div class="chart"><canvas id="dailyReported"></canvas></div></div>
</div>
<div class="row one">
  <div class="box"><h3>Cumulative cost &amp; projection to cycle end</h3><div class="chart"><canvas id="cumulative"></canvas></div></div>
</div>
<div class="row">
  <div class="box"><h3>Token mix by day</h3><div class="chart"><canvas id="mix"></canvas></div></div>
  <div class="box"><h3>Efficiency by day &mdash; cache hit (left) &amp; output ratio (right)</h3><div class="chart"><canvas id="eff"></canvas></div></div>
</div>
<div class="row one">
  <div class="box"><h3>Cost by model &mdash; reported vs peak-aware</h3><div class="chart"><canvas id="modelCost"></canvas></div></div>
</div>
<div class="note" id="note"></div>
<script>
const D = {"range": "5-16 Sep 2026", "generated": "2026-09-16 09:03", "unrecorded_title_calls": 72, "cycle": {"start": "05 Sep 2026", "end": "05 Oct 2026", "total_days": 30, "elapsed_days": 11.4, "per_day": 1.2015, "projected_go_cost": 36.0448, "labels": ["09/05", "09/06", "09/07", "09/08", "09/09", "09/10", "09/11", "09/12", "09/13", "09/14", "09/15", "09/16", "09/17", "09/18", "09/19", "09/20", "09/21", "09/22", "09/23", "09/24", "09/25", "09/26", "09/27", "09/28", "09/29", "09/30", "10/01", "10/02", "10/03", "10/04", "10/05"], "reported": [0.0, 0.0, 0.446767, 0.486354, 0.486354, 0.748897, 2.297038, 2.297038, 2.297038, 3.763684, 8.740222, 9.184285, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null], "actual": [0.0, 0.0, 0.628508, 0.690303, 0.690303, 1.215389, 3.95443, 3.95443, 3.95443, 6.201227, 12.998362, 13.670241, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null], "projected": [null, null, null, null, null, null, null, null, null, null, null, 13.670241, 14.871734, 16.073228, 17.274721, 18.476214, 19.677707, 20.879201, 22.080694, 23.282187, 24.48368, 25.685174, 26.886667, 28.08816, 29.289653, 30.491147, 31.69264, 32.894133, 34.095626, 35.29712, 36.498613]}, "grand": {"requests": 8077, "ti": 21730788, "to": 7164308, "tr": 4665322, "tcr": 840922752, "tcw": 0, "cost": 9.219014941999998, "go_reported": 9.184285449999994, "go_cost": 13.670241185999968, "go_requests": 7189, "peak_cost": 9.098951555999989, "offpeak_cost": 4.571289629999974}, "days": [{"date": "09/05", "requests": 0, "ti": 0, "to": 0, "tr": 0, "tcr": 0, "tcw": 0, "cost": 0.0, "go_reported": 0.0, "go_cost": 0.0, "go_requests": 0, "peak_cost": 0.0, "offpeak_cost": 0.0}, {"date": "09/06", "requests": 0, "ti": 0, "to": 0, "tr": 0, "tcr": 0, "tcw": 0, "cost": 0.0, "go_reported": 0.0, "go_cost": 0.0, "go_requests": 0, "peak_cost": 0.0, "offpeak_cost": 0.0}, {"date": "09/07", "requests": 77, "ti": 1726073, "to": 177241, "tr": 64553, "tcr": 3478528, "tcw": 0, "cost": 0.48149620799999987, "go_reported": 0.44676671599999995, "go_cost": 0.6285083280000001, "go_requests": 57, "peak_cost": 0.6285083280000001, "offpeak_cost": 0.0}, {"date": "09/08", "requests": 21, "ti": 38018, "to": 37249, "tr": 28864, "tcr": 948480, "tcw": 0, "cost": 0.039587660000000004, "go_reported": 0.039587660000000004, "go_cost": 0.06179508, "go_requests": 21, "peak_cost": 0.06179508, "offpeak_cost": 0.0}, {"date": "09/09", "requests": 454, "ti": 448892, "to": 357068, "tr": 224310, "tcr": 59813248, "tcw": 0, "cost": 0.0, "go_reported": 0.0, "go_cost": 0.0, "go_requests": 0, "peak_cost": 0.0, "offpeak_cost": 0.0}, {"date": "09/10", "requests": 541, "ti": 1345312, "to": 562962, "tr": 379670, "tcr": 53574400, "tcw": 0, "cost": 0.2625426659999999, "go_reported": 0.2625426659999999, "go_cost": 0.5250853319999998, "go_requests": 127, "peak_cost": 0.5250853319999998, "offpeak_cost": 0.0}, {"date": "09/11", "requests": 1163, "ti": 3235587, "to": 1329905, "tr": 781613, "tcr": 114180736, "tcw": 0, "cost": 1.5481406279999994, "go_reported": 1.5481406279999994, "go_cost": 2.739041214000001, "go_requests": 1163, "peak_cost": 2.226435911999998, "offpeak_cost": 0.5126053020000001}, {"date": "09/12", "requests": 0, "ti": 0, "to": 0, "tr": 0, "tcr": 0, "tcw": 0, "cost": 0.0, "go_reported": 0.0, "go_cost": 0.0, "go_requests": 0, "peak_cost": 0.0, "offpeak_cost": 0.0}, {"date": "09/13", "requests": 0, "ti": 0, "to": 0, "tr": 0, "tcr": 0, "tcw": 0, "cost": 0.0, "go_reported": 0.0, "go_cost": 0.0, "go_requests": 0, "peak_cost": 0.0, "offpeak_cost": 0.0}, {"date": "09/14", "requests": 1012, "ti": 2576439, "to": 1211704, "tr": 818744, "tcr": 117719424, "tcw": 0, "cost": 1.4666465219999998, "go_reported": 1.4666465219999998, "go_cost": 2.246796948, "go_requests": 1012, "peak_cost": 1.5603008520000001, "offpeak_cost": 0.6864960960000005}, {"date": "09/15", "requests": 4438, "ti": 11815160, "to": 3084171, "tr": 2095604, "tcr": 451253632, "tcw": 0, "cost": 4.97653749599998, "go_reported": 4.97653749599998, "go_cost": 6.797135273999993, "go_requests": 4438, "peak_cost": 3.6411955560000036, "offpeak_cost": 3.1559397180000017}, {"date": "09/16", "requests": 371, "ti": 545307, "to": 404008, "tr": 271964, "tcr": 39954304, "tcw": 0, "cost": 0.44406376200000003, "go_reported": 0.44406376200000003, "go_cost": 0.6718790099999997, "go_requests": 371, "peak_cost": 0.45563049600000016, "offpeak_cost": 0.21624851400000003}], "by_model": [{"requests": 5256, "ti": 13215412, "to": 3905580, "tr": 2646996, "tcr": 541369216, "tcw": 0, "cost": 5.949767447999984, "go_reported": 5.949767447999984, "go_cost": 7.998180473999985, "go_requests": 5256, "peak_cost": 4.0968260520000035, "offpeak_cost": 3.901354422, "model": "deepseek-v4.1-flash (high)", "id": "deepseek-v4.1-flash", "go_model": "DeepSeek V4.1 Flash"}, {"requests": 848, "ti": 2511093, "to": 1191943, "tr": 793420, "tcr": 108521472, "tcw": 0, "cost": 1.4173941659999998, "go_reported": 1.4173941659999998, "go_cost": 2.3226845759999994, "go_requests": 848, "peak_cost": 1.8105808199999993, "offpeak_cost": 0.5121037560000001, "model": "deepseek-v4.1-flash (max)", "id": "deepseek-v4.1-flash", "go_model": "DeepSeek V4.1 Flash"}, {"requests": 383, "ti": 3347377, "to": 481816, "tr": 141440, "tcr": 26030720, "tcw": 0, "cost": 0.9837835039999996, "go_reported": 0.9490540119999993, "go_cost": 1.5441319859999991, "go_requests": 363, "peak_cost": 1.472561292, "offpeak_cost": 0.07157069399999999, "model": "deepseek-v4-flash (max)", "id": "deepseek-v4-flash", "go_model": "DeepSeek V4 Flash"}, {"requests": 350, "ti": 981229, "to": 671368, "tr": 532468, "tcr": 32945792, "tcw": 0, "cost": 0.5711598960000004, "go_reported": 0.5711598960000004, "go_cost": 1.2321594420000002, "go_requests": 350, "peak_cost": 1.1666338319999998, "offpeak_cost": 0.06552561000000001, "model": "deepseek-flash (max)", "id": "deepseek-flash", "go_model": "DeepSeek V4.1 Flash"}, {"requests": 371, "ti": 517617, "to": 217184, "tr": 112832, "tcr": 28832384, "tcw": 0, "cost": 0.29445010200000005, "go_reported": 0.29445010200000005, "go_cost": 0.570624882, "go_requests": 371, "peak_cost": 0.55234956, "offpeak_cost": 0.018275322, "model": "deepseek-flash (default)", "id": "deepseek-flash", "go_model": "DeepSeek V4.1 Flash"}, {"requests": 1, "ti": 16279, "to": 21, "tr": 0, "tcr": 1792, "tcw": 0, "cost": 0.002459826, "go_reported": 0.002459826, "go_cost": 0.002459826, "go_requests": 1, "peak_cost": 0.0, "offpeak_cost": 0.002459826, "model": "deepseek-v4-flash (high)", "id": "deepseek-v4-flash", "go_model": "DeepSeek V4 Flash"}, {"requests": 868, "ti": 1141781, "to": 696396, "tr": 438166, "tcr": 103221376, "tcw": 0, "cost": 0.0, "go_reported": 0.0, "go_cost": 0.0, "go_requests": 0, "peak_cost": 0.0, "offpeak_cost": 0.0, "model": "deepseek-v4.1-flash-expires-on-0910 (default)", "id": "deepseek-v4.1-flash-expires-on-0910", "go_model": null}]};

const fmt = n => n.toLocaleString('en-US');
const money = (v, d = 2) => '$' + v.toFixed(d);
const pct = v => v.toFixed(1) + '%';
const pctOf = (a, b) => (b > 0 ? a / b * 100 : 0);
const compact = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : fmt(n);

const g = D.grand, cy = D.cycle;
const tokens = g.ti + g.to + g.tcr + g.tcw;      // == opencode's tokens.total
const uncached = g.ti + g.to + g.tcw;            // `to` already includes reasoning
const input = g.ti, cacheRead = g.tcr, reasoning = g.tr, cacheWrite = g.tcw;
const output = g.to - g.tr;
const cacheHit = pctOf(g.tcr, g.ti + g.tcr);
const outRatio = pctOf(g.to, g.ti + g.tcr);
const goPerReq = g.go_requests ? g.go_cost / g.go_requests : 0;
const perMUncached = uncached ? g.go_cost / uncached * 1e6 : 0;
const peakShare = pctOf(g.peak_cost, g.go_cost);
const goVsReported = g.go_reported > 0 ? g.go_cost / g.go_reported * 100 - 100 : 0;
const notOnGo = g.requests - g.go_requests;

document.getElementById('sub').innerHTML =
  `${D.range} · cycle ${cy.start} → ${cy.end} · day ${cy.elapsed_days} of ${cy.total_days} · generated ${D.generated}`;

const tile = (label, value, cls, sub) =>
  `<div class="m ${cls}"><div class="v">${value}</div><div class="l">${label}</div>` +
  (sub ? `<div class="l">${sub}</div>` : '') + `</div>`;

document.getElementById('kpis').innerHTML = [
  tile('Reported', money(g.go_reported, 2), 'bl', 'recorded by OpenCode Go'),
  tile('Peak-aware', money(g.go_cost, 2), 'yl', 'peak + off-peak rates'),
  tile('Requests', fmt(g.requests), 'cy', fmt(g.go_requests) + ' on Go'),
  tile('Peak-aware $ / request', money(goPerReq, 4), 'cy'),
  tile('Cache hit', pct(cacheHit), 'gn'),
  tile('Output ratio', pct(outRatio), 'or'),
].join('');

document.getElementById('tokenKpis').innerHTML = [
  tile('Total', fmt(tokens), 'pu'),
  tile('Input', fmt(input), 'bl'),
  tile('Cache read', fmt(cacheRead), 'gn', pct(pctOf(cacheRead, tokens)) + ' of total'),
  tile('Output', fmt(output), 'or'),
  tile('Reasoning', fmt(reasoning), 'pu', pct(pctOf(reasoning, tokens)) + ' of total'),
  ...(cacheWrite > 0 ? [tile('Cache write', fmt(cacheWrite), 'cy')] : []),
].join('');

document.getElementById('cycleKpis').innerHTML = [
  tile('Peak cost', money(g.peak_cost, 2), 'rd', pct(peakShare) + ' of Go cost'),
  tile('Off-peak cost', money(g.offpeak_cost, 2), 'gn', pct(100 - peakShare) + ' of Go cost'),
  tile(`Projected ${cy.end}`, money(cy.projected_go_cost, 2), 'yl', money(cy.per_day, 4) + '/day'),
  tile('Peak-aware vs reported', (goVsReported >= 0 ? '+' : '') + pct(goVsReported), 'or',
       money(g.go_cost - g.go_reported, 4) + ' undercounted'),
].join('');

const AXIS = { ticks:{ color:'#8b949e' }, grid:{ color:'#30363d' }, border:{ color:'#30363d' } };
const LEGEND = { labels:{ color:'#c9d1d9', boxWidth:12, font:{ size:10 } } };
const base = { responsive:true, maintainAspectRatio:false, plugins:{ legend:LEGEND }, scales:{ x:AXIS, y:AXIS } };
const moneyAxis = v => '$' + (v >= 1 ? v.toFixed(1) : v.toFixed(2));

const labels = D.days.map(d => d.date);
const has = d => d.requests > 0;
const cacheHitBy = d => has(d) ? pctOf(d.tcr, d.ti + d.tcr) : null;
const outRatioBy = d => has(d) ? pctOf(d.to, d.ti + d.tcr) : null;
const maxOut = Math.max(1, ...D.days.map(outRatioBy).filter(v => v !== null));

// Daily cost as two bar plots on one shared y scale, so the two are comparable
// at a glance: left is peak-aware (stacked by rate window), right is reported.
const maxDaily = Math.max(1, ...D.days.map(d => Math.max(d.go_cost, d.go_reported)));
const dailyY = { ...AXIS, suggestedMax: maxDaily * 1.05,
                 ticks:{ color:'#8b949e', callback:moneyAxis } };

new Chart(document.getElementById('dailyAware'), {
  type:'bar',
  data:{ labels, datasets:[
    { label:'Off-peak $', data:D.days.map(d => d.offpeak_cost), backgroundColor:'rgba(63,185,80,0.75)',
      stack:'cost', borderRadius:3 },
    { label:'Peak $', data:D.days.map(d => d.peak_cost), backgroundColor:'rgba(248,81,73,0.8)',
      stack:'cost', borderRadius:3 },
  ]},
  options:{ ...base,
    plugins:{ legend:LEGEND, tooltip:{ callbacks:{
      label: ctx => ctx.dataset.label + ': ' + money(ctx.parsed.y, 4),
      footer: items => 'peak-aware total: ' + money(items.reduce((s, i) => s + i.parsed.y, 0), 4) } } },
    scales:{ x:{ ...AXIS, stacked:true }, y:{ ...dailyY, stacked:true } } },
});

new Chart(document.getElementById('dailyReported'), {
  type:'bar',
  data:{ labels, datasets:[
    { label:'Reported $', data:D.days.map(d => d.go_reported),
      backgroundColor:'rgba(88,166,255,0.75)', borderRadius:3 },
  ]},
  options:{ ...base,
    plugins:{ legend:LEGEND, tooltip:{ callbacks:{
      label: ctx => money(ctx.parsed.y, 4) + ' · ' + fmt(D.days[ctx.dataIndex].go_requests) + ' reqs on Go' } } },
    scales:{ x:AXIS, y:dailyY } },
});

// Cumulative spend across the cycle; the dashed tail is the current rate carried forward.
new Chart(document.getElementById('cumulative'), {
  type:'line',
  data:{ labels:cy.labels, datasets:[
    { label:'Reported', data:cy.reported, borderColor:'#58a6ff', fill:false,
      tension:0.25, pointRadius:0, spanGaps:false },
    { label:'Peak-aware', data:cy.actual, borderColor:'#d29922', backgroundColor:'rgba(210,153,34,0.15)',
      fill:true, tension:0.25, pointRadius:0, spanGaps:false },
    { label:'Projected (peak-aware)', data:cy.projected, borderColor:'#f0883e', borderDash:[5,4],
      fill:false, tension:0.25, pointRadius:0, spanGaps:false },
  ]},
  options:{ ...base,
    plugins:{ legend:LEGEND, tooltip:{ callbacks:{ label: ctx => ctx.dataset.label + ': ' + money(ctx.parsed.y, 4) } } },
    scales:{ x:AXIS, y:{ ...AXIS, ticks:{ color:'#8b949e', callback:moneyAxis } } } },
});

// What the token count is made of, per day (stacked, same order as the tiles)
new Chart(document.getElementById('mix'), {
  type:'bar',
  data:{ labels, datasets:[
    { label:'Cache read', data:D.days.map(d => d.tcr), backgroundColor:'rgba(63,185,80,0.75)', stack:'tok' },
    { label:'Input', data:D.days.map(d => d.ti), backgroundColor:'rgba(88,166,255,0.85)', stack:'tok' },
    { label:'Output', data:D.days.map(d => d.to - d.tr), backgroundColor:'rgba(240,136,62,0.9)', stack:'tok' },
    { label:'Reasoning', data:D.days.map(d => d.tr), backgroundColor:'rgba(188,140,255,0.9)', stack:'tok' },
  ]},
  options:{ ...base,
    plugins:{ legend:LEGEND, tooltip:{ callbacks:{ label: ctx => `${ctx.dataset.label}: ${fmt(ctx.parsed.y)}` } } },
    scales:{ x:{ ...AXIS, stacked:true },
      y:{ ...AXIS, stacked:true, ticks:{ color:'#8b949e', callback:compact } } } },
});

// Efficiency over time: cache hit is ~100%, output ratio is ~1%, so two axes.
new Chart(document.getElementById('eff'), {
  type:'line',
  data:{ labels, datasets:[
    { label:'Cache hit %', data:D.days.map(cacheHitBy), borderColor:'#3fb950',
      backgroundColor:'rgba(63,185,80,0.12)', fill:true, tension:0.3, pointRadius:2, spanGaps:true, yAxisID:'y' },
    { label:'Output ratio %', data:D.days.map(outRatioBy), borderColor:'#bc8cff',
      backgroundColor:'rgba(188,140,255,0.12)', fill:true, tension:0.3, pointRadius:2, spanGaps:true, yAxisID:'y1' },
  ]},
  options:{ ...base, scales:{ x:AXIS,
    y:{ position:'left', min:0, max:100, ticks:{ color:'#3fb950', callback:v => v + '%' }, grid:{ color:'#30363d' } },
    y1:{ position:'right', min:0, suggestedMax:maxOut * 1.3,
         ticks:{ color:'#bc8cff', callback:v => v.toFixed(1) + '%' }, grid:{ drawOnChartArea:false } } } },
});

// Grouped horizontal bars: both cost views per model, sorted by Go cost.
const rows = D.by_model.slice().sort((a, b) => b.go_cost - a.go_cost);
const costEl = document.getElementById('modelCost');
costEl.parentElement.style.height = Math.max(190, rows.length * 34 + 40) + 'px';
new Chart(costEl, {
  type:'bar',
  data:{ labels:rows.map(m => m.model), datasets:[
    { label:'Reported $', data:rows.map(m => m.go_reported), backgroundColor:'rgba(88,166,255,0.7)', borderRadius:3 },
    { label:'Peak-aware $', data:rows.map(m => m.go_cost), backgroundColor:'rgba(210,153,34,0.8)', borderRadius:3 },
  ]},
  options:{ ...base, indexAxis:'y',
    plugins:{ legend:LEGEND, tooltip:{ callbacks:{
      title: items => { const m = rows[items[0].dataIndex];
        return m.go_model && m.go_model !== m.id ? `${m.model}  →  ${m.go_model}` : m.model; },
      label: ctx => {
      const m = rows[ctx.dataIndex];
      if (ctx.datasetIndex === 1)
        return `Peak-aware ${money(m.go_cost, 4)} · ${fmt(m.go_requests)} reqs · ${money(m.go_requests ? m.go_cost / m.go_requests : 0, 4)}/req`;
      return `Reported ${money(m.go_reported, 4)} · ${fmt(m.go_requests)} reqs`;
    } } } },
    scales:{ x:{ ...AXIS, ticks:{ color:'#8b949e', callback:moneyAxis } },
             y:{ ...AXIS, grid:{ display:false }, ticks:{ color:'#c9d1d9', font:{ size:10 } } } } },
});

document.getElementById('note').innerHTML =
  `${money(perMUncached, 2)} per 1M non-cache tokens at peak-aware Go rates` +
  ` · peak is Mon-Fri 01:00-04:00 and 06:00-10:00 UTC` +
  ` · one request = one step-finish part (one provider call)` +
  `<br>Reported = the cost OpenCode Go recorded (off-peak rates only); peak-aware = the same tokens priced peak/off-peak.` +
  (notOnGo ? `<br>${fmt(notOnGo)} requests ran on the direct DeepSeek provider, not Go, and are excluded from both.` : '') +
  (D.unrecorded_title_calls
    ? `<br>+${D.unrecorded_title_calls} title-generation calls are not counted or costed: ` +
      `opencode discards their usage before it is persisted.`
    : '');
</script>
</body>
</html>
