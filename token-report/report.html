function fmt(n) { return n.toLocaleString('en-US'); }
function pct(a, b) { return b > 0 ? (a / b * 100).toFixed(1) : '0.0'; }
function cacheHit(s) { const ti = s.ti + s.tcr; return ti > 0 ? (s.tcr / ti * 100).toFixed(1) : '0.0'; }
function outputRatio(s) { const ti = s.ti + s.tcr; return ti > 0 ? ((s.to + s.tr) / ti * 100).toFixed(1) : '0.0'; }
function totalTokens(s) { return s.ti + s.to + s.tr; }
function outputTokens(s) { return s.to + s.tr; }

function summarize(sessions) {
  let ti = 0, to = 0, tr = 0, tcr = 0, tcw = 0, cost = 0;
  const byAgent = {}, byModel = {};
  for (const s of sessions) {
    ti += s.ti; to += s.to; tr += s.tr; tcr += s.tcr; tcw += s.tcw; cost += s.cost;
    const a = s.agent;
    if (!byAgent[a]) byAgent[a] = {ti:0,to:0,tr:0,tcr:0,cost:0,count:0};
    byAgent[a].ti += s.ti; byAgent[a].to += s.to; byAgent[a].tr += s.tr;
    byAgent[a].tcr += s.tcr; byAgent[a].cost += s.cost; byAgent[a].count++;
    const m = s.model;
    if (!byModel[m]) byModel[m] = {ti:0,to:0,tr:0,tcr:0,cost:0,count:0};
    byModel[m].ti += s.ti; byModel[m].to += s.to; byModel[m].tr += s.tr;
    byModel[m].tcr += s.tcr; byModel[m].cost += s.cost; byModel[m].count++;
  }
  return { ti, to, tr, tcr, tcw, cost, total: ti + to + tr, output: to + tr, byAgent, byModel };
}

      type: 'doughnut',
      data: { labels: agentLabels, datasets: [{ data: agentCosts, backgroundColor: agentColors, borderWidth: 0 }] },
      options: { responsive: true, plugins: { legend: { labels: { color: '#c9d1d9', font: { size: 11 } } } } }
    });

    const modelLabels = Object.keys(s.byModel);
    const modelCosts = modelLabels.map(m => s.byModel[m].cost);
    new Chart(document.getElementById('model-' + day.replace(' ','')), {
      type: 'doughnut',
      data: { labels: modelLabels, datasets: [{ data: modelCosts, backgroundColor: ['#58a6ff','#3fb950','#d29922'], borderWidth: 0 }] },
      options: { responsive: true, plugins: { legend: { labels: { color: '#c9d1d9', font: { size: 11 } } } } }
    });

    // Token breakdown stacked bar
    const tAgentLabels = Object.keys(s.byAgent);
    new Chart(document.getElementById('tokens-' + day.replace(' ','')), {
      type: 'bar',
      data: {
        labels: tAgentLabels,
        datasets: [
          { label: 'Input', data: tAgentLabels.map(a => s.byAgent[a].ti), backgroundColor: '#58a6ff' },
          { label: 'Output', data: tAgentLabels.map(a => s.byAgent[a].to), backgroundColor: '#3fb950' },
          { label: 'Reasoning', data: tAgentLabels.map(a => s.byAgent[a].tr), backgroundColor: '#bc8cff' },
        ]
      },
      options: {
        responsive: true,
        scales: {
          x: { stacked: true, ticks: { color: '#8b949e' }, grid: { color: '#30363d' } },
          y: { stacked: true, ticks: { color: '#8b949e' }, grid: { color: '#30363d' } }
        },
        plugins: { legend: { labels: { color: '#c9d1d9' } } }
      }
    });

    // Ratio per session
    const sessLabels = sessions.map(s => s.title.slice(0, 20));
    const chData = sessions.map(s => parseFloat(cacheHit(s)));
    const orData = sessions.map(s => parseFloat(outputRatio(s)));
    new Chart(document.getElementById('ratio-' + day.replace(' ','')), {
      type: 'bar',
      data: {
        labels: sessLabels,
        datasets: [
          { label: 'Cache Hit %', data: chData, backgroundColor: 'rgba(63,185,80,0.7)' },
          { label: 'Output Ratio %', data: orData, backgroundColor: 'rgba(188,140,255,0.7)' },
        ]
      },
      options: {
        responsive: true,
        scales: {
          x: { ticks: { color: '#8b949e', maxRotation: 45 }, grid: { color: '#30363d' } },
          y: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' } }
        },
        plugins: { legend: { labels: { color: '#c9d1d9' } } }
      }
    });
  });
}
</script>
</body>
</html>
